<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
</head>

<body>
    <form method="post" action="">
        <label>Full Name * <input name="fullName" placeholder="John Doe" type="text" required></label><br>
        <label>Email * <input name="email" placeholder="email@email.com" pattern="^[^\s@]+@[A-Za-z0-9]+.[A-Za-z0-9]{2,}$" required></label><br>
        <label for="password">Password *</label>
        <input name="password" minlength="10" required><br>
        <label>Feedback Category
            <select name="feedbackCat">
                <option value="design">Design</option>
                <option value="performance">Performance</option>
                <option value="content">Content</option>
                <option value="other">Other</option>
            </select>
        </label><br>
        <fieldset>
            <legend>Preferred Contact Method</legend>
            <label>Email
                <input type="radio" name="contactMethod" value="email" checked>
            </label>
            <label>Phone
                <input type="radio" name="contactMethod" value="phone">
            </label>
            <label>Mail
                <input type="radio" name="contactMethod" value="mail">
            </label>
        </fieldset>
        <fieldset>
            <legend>Additional Features of Interest</legend>
            <label>Responsive Design
                <input type="checkbox" name="feat" value="responsive-design" checked>
            </label>
            <label>Color Design
                <input type="checkbox" name="feat" value="color-design">
            </label>
        </fieldset>
        <label>Comments
            <textarea name="comments" rows="5" cols="50"></textarea>
        </label>
        <button type="submit">Submit</button>
        <legend>* Required Fields</legend>
    </form>
</body>

</html>
